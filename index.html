<!doctype html>
<html lang="pt-BR">
<head>

<title>Liquid Glass Logo Studio</title>
<style>
:root{color-scheme:light;--ink:#25252a;--muted:#777982;--glass:rgba(255,255,255,.76);--line:rgba(255,255,255,.9);--shadow:0 8px 28px rgba(55,60,75,.11)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fafafa;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink)}
#stage{position:fixed;inset:0;overflow:hidden;background:#fafafa;touch-action:pan-y}
#glassCanvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
:root{--dock-space:calc(76px + env(safe-area-inset-bottom))}
#controls{position:absolute;z-index:3;left:8px;right:8px;bottom:max(7px,env(safe-area-inset-bottom));transform:none;display:flex;flex-direction:row;flex-wrap:nowrap;align-items:center;justify-content:space-evenly;gap:2px;padding:6px 7px;width:auto;height:52px;max-width:none;overflow:hidden;white-space:nowrap;scrollbar-width:none;border:1px solid rgba(255,255,255,.94);border-radius:999px;background:rgba(255,255,255,.78);box-shadow:0 7px 24px rgba(55,60,75,.12),inset 0 1px 0 rgba(255,255,255,.98);backdrop-filter:blur(22px) saturate(1.35);-webkit-backdrop-filter:blur(22px) saturate(1.35);}
#controls::-webkit-scrollbar{display:none}
.tool{flex:0 0 30px;width:30px;height:30px;border:1px solid rgba(225,227,232,.8);border-radius:50%;background:linear-gradient(145deg,#fff,#f7f7f8);color:#303139;display:grid;place-items:center;box-shadow:0 2px 7px rgba(40,45,60,.07),inset 0 1px 0 #fff;cursor:pointer;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative;}
.tool:active{transform:scale(.93)}.tool[aria-pressed="true"]{border-color:#aeb3bd;box-shadow:inset 0 1px 5px rgba(50,55,70,.12),0 1px 2px rgba(40,45,60,.05)}
.tool svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.separator{width:1px;height:28px;background:rgba(125,130,140,.17);margin:0 1px}
#imageScaleControl{display:flex;flex:0 0 52px;flex-direction:column;gap:2px;min-width:52px;padding:0}#imageScaleControl label{font-size:9px;color:#686b74;text-align:center;line-height:1}#logoScale{width:52px;height:15px;margin:0;accent-color:#777f91;cursor:pointer}#fileInput{display:none}#toast{position:absolute;z-index:4;left:50%;bottom:calc(var(--dock-space) + 8px);transform:translate(-50%,8px);padding:9px 14px;border-radius:20px;background:rgba(38,39,44,.78);color:white;font-size:12px;letter-spacing:.01em;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;white-space:nowrap;backdrop-filter:blur(12px)}#toast.show{opacity:1;transform:translate(-50%,0)}
#fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#777;font-size:14px;text-align:center;padding:28px}
@media(min-width:700px){:root{--dock-space:96px}#controls{left:50%;right:auto;bottom:18px;transform:translateX(-50%);width:max-content;min-width:460px;max-width:calc(100vw - 32px);height:64px;gap:7px;padding:8px 14px;justify-content:center}.tool{flex:0 0 44px;width:44px;height:44px}#imageScaleControl{flex:0 0 92px;min-width:92px}#logoScale{width:92px}}
</style>
</head>
<body>
<main id="stage" aria-label="Estúdio Liquid Glass">
 <canvas id="glassCanvas"></canvas>
 <div id="fallback">Este navegador não disponibilizou WebGL2. Abra o aplicativo no Safari ou Chrome atualizado.</div>
 <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/svg+xml">
 <nav id="controls" aria-label="Ferramentas">
  <button class="tool" id="uploadBtn" aria-label="Adicionar logo" title="Adicionar logo"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="3"/><circle cx="9" cy="9" r="1.5"/><path d="m4 17 5-5 3.5 3.5 2.5-2.5 5 5"/><path d="M18 2v5M15.5 4.5h5"/></svg></button>
  <div id="imageScaleControl"><label for="logoScale">Tamanho da imagem</label><input id="logoScale" type="range" min="25" max="200" value="100" step="1" aria-label="Tamanho da imagem de fundo"></div>
  <div class="separator"></div>
  <button class="tool" id="circleBtn" aria-label="Formato circular" title="Formato circular" aria-pressed="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.2"/></svg></button>
  <button class="tool" id="squareBtn" aria-label="Formato quadrado arredondado" title="Formato quadrado arredondado" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="3.8" y="3.8" width="16.4" height="16.4" rx="4.2"/></svg></button>
  <div class="separator"></div>
  <button class="tool" id="addItemBtn" aria-label="Adicionar item" title="Adicionar item"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.8"/><path d="M12 8v8M8 12h8"/></svg></button>
  <button class="tool" id="removeItemBtn" aria-label="Remover item selecionado" title="Remover item selecionado"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.8"/><path d="M8 12h8"/></svg></button>
  <div class="separator"></div>
  <button class="tool" id="saveBtn" aria-label="Salvar PNG" title="Salvar PNG"><svg viewBox="0 0 24 24"><path d="M12 3.5v11m-4-4 4 4 4-4"/><path d="M4 16.5v2A2 2 0 0 0 6 20.5h12a2 2 0 0 0 2-2v-2"/></svg></button>
 </nav>
 <div id="toast" role="status"></div>
</main>
<script>
(() => {
'use strict';
const canvas=document.getElementById('glassCanvas'),stage=document.getElementById('stage'),fileInput=document.getElementById('fileInput');
const uploadBtn=document.getElementById('uploadBtn'),circleBtn=document.getElementById('circleBtn'),squareBtn=document.getElementById('squareBtn'),saveBtn=document.getElementById('saveBtn'),toast=document.getElementById('toast');
let shape=0,logo=null,logoUrl=null,logoScale=1,raf=0,gl=null,program=null,texture=null,texCanvas=document.createElement('canvas'),texCtx=texCanvas.getContext('2d');
const lenses=[{x:0,y:0,shape:0,scale:1,auto:true,phase:0}],MAX_LENSES=12;let activeLens=0;
let dpr=1,px=0,py=0,lensScale=1,pressT0=-10,lastAutoRipple=0,now=0,t0=0,prev=0,pinchStart=0,pinchScale=1,autoMotion=true,dragOffsetX=0,dragOffsetY=0,tapCount=0,lastTapAt=0;const activePointers=new Map(),pointerStarts=new Map();
const ripples=[],rippleData=new Float32Array(32);
const accents=['#bfd7ff','#ffd6e8','#ffe9c7','#c9f2e4'];
const VERT=`#version 300 es
void main(){vec2 p=vec2(float((gl_VertexID<<1)&2),float(gl_VertexID&2));gl_Position=vec4(p*2.0-1.0,0.0,1.0);}`;
const FRAG=`#version 300 es
precision highp float;precision highp int;
uniform sampler2D uTex;uniform vec2 uRes;uniform float uTime;uniform float uDpr;uniform vec4 uLensData[12];uniform int uShapeData[12];uniform int uLensCount;uniform float uMag;uniform float uRefract;uniform float uFrost;uniform float uBgLum;uniform int uAccentCount;uniform vec3 uAccents[4];uniform int uRippleCount;uniform vec4 uRipples[8];out vec4 outColor;
float hash21(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
vec2 rippleOffset(vec2 frag){vec2 off=vec2(0.0);for(int i=0;i<8;i++){if(i>=uRippleCount)break;vec4 rp=uRipples[i];vec2 d=frag-rp.xy;float dist=max(length(d),1.0);float front=rp.z*520.0*uDpr;float x=(dist-front)/(90.0*uDpr);float wave=sin(x*6.2831)*exp(-x*x*3.0);float atten=exp(-rp.z*2.2)*exp(-dist/(900.0*uDpr));off+=(d/dist)*wave*atten*rp.w*14.0*uDpr;}return off;}
vec3 applyAccents(vec3 c,vec2 uv){for(int i=0;i<4;i++){if(i>=uAccentCount)break;float fi=float(i);float t=uTime*0.11+fi*1.7;vec2 center=vec2(0.5+0.38*sin(t*0.9+fi*2.4),0.5+0.34*cos(t*0.7+fi*1.3));vec2 d=(uv-center)*vec2(uRes.x/uRes.y,1.0);float a=1.0-smoothstep(0.0,0.55,length(d));if(uBgLum>0.5)c*=mix(vec3(1.0),uAccents[i],a*0.55);else c=1.0-(1.0-c)*(1.0-uAccents[i]*a*0.4);}return c;}
vec3 bgAt(vec2 frag,vec2 roff){vec2 uv=clamp((frag+roff)/uRes,0.0,1.0);return applyAccents(texture(uTex,uv).rgb,uv);}
float roundedBox(vec2 p,vec2 b,float r){vec2 q=abs(p)-(b-vec2(r));return length(max(q,0.0))+min(max(q.x,q.y),0.0)-r;}
void main(){
 vec2 frag=gl_FragCoord.xy;vec2 roff=rippleOffset(frag);vec3 col=bgAt(frag,roff);
 for(int i=0;i<12;i++){
  if(i>=uLensCount)break;
  vec4 lens=uLensData[i];vec2 lensC=lens.xy;float R=lens.z*lens.w;vec2 q=frag-lensC;
  float ang=atan(q.y,q.x);float wob=0.030*sin(ang*3.0+uTime*2.1)+0.022*sin(ang*5.0-uTime*3.3)+0.014*sin(ang*7.0+uTime*4.7);
  float r=length(q);float Rw=R*(1.0+wob);
  float dist=uShapeData[i]==0?(r-Rw):roundedBox(q,vec2(Rw*0.98),Rw*0.24);
  float aa=1.5*uDpr;float inside=smoothstep(aa,-aa,dist);
  vec2 shq=frag-(lensC-vec2(0.0,R*0.22));float shadow=smoothstep(R*1.35,R*0.55,length(shq))*0.10*(1.0-inside);
  vec3 layer=bgAt(frag,roff)*(1.0-shadow);
  if(inside>0.0){
   float r01=uShapeData[i]==0?clamp(r/Rw,0.0,1.0):clamp(max(abs(q.x),abs(q.y))/Rw,0.0,1.0);
   float h=sqrt(max(1.0-r01*r01,0.0));vec3 N=normalize(vec3(q/Rw,h*1.15));
   vec2 mfrag=lensC+(frag-lensC)/uMag;float bend=1.0-h;vec2 refr=-N.xy*bend*uRefract*R*0.9;
   float ca=0.16*uRefract;float frostR=uFrost*(0.25+0.75*bend)*10.0*uDpr;
   vec2 taps[5]=vec2[5](vec2(0.0),vec2(1.0,0.3),vec2(-0.6,0.9),vec2(-0.9,-0.5),vec2(0.5,-0.9));
   vec3 acc=vec3(0.0);
   for(int j=0;j<5;j++){vec2 o=taps[j]*frostR;acc.r+=bgAt(mfrag+refr*(1.0+ca)+o,roff).r;acc.g+=bgAt(mfrag+refr+o,roff).g;acc.b+=bgAt(mfrag+refr*(1.0-ca)+o,roff).b;}
   vec3 glass=acc/5.0;float lum=dot(glass,vec3(0.299,0.587,0.114));glass=mix(vec3(lum),glass,1.18);
   vec3 L=normalize(vec3(-0.35,0.55,0.75));vec3 H=normalize(L+vec3(0.0,0.0,1.0));float ndh=max(dot(N,H),0.0);
   float spec=pow(ndh,90.0)*0.9+pow(ndh,18.0)*0.18;float fres=pow(1.0-max(N.z,0.0),2.5);
   float innerShade=smoothstep(0.2,1.0,dot(normalize(N.xy+1e-5),normalize(vec2(0.4,-0.8))))*fres*0.10;
   glass*=1.0-innerShade;glass+=spec+fres*0.16;glass+=smoothstep(aa*2.5,0.0,abs(dist))*0.25;
   glass+=(hash21(frag+uTime)-0.5)*uFrost*0.05;layer=mix(layer,glass,inside);
  }
  col=mix(col,layer,max(inside,shadow));
 }
 outColor=vec4(col,1.0);
}`;
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS)){console.error(gl.getShaderInfoLog(s));return null;}return s;}
function showToast(msg){toast.textContent=msg;toast.classList.add('show');clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>toast.classList.remove('show'),1800);}
function hexRgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16)/255,parseInt(h.slice(2,4),16)/255,parseInt(h.slice(4,6),16)/255];}
function paintBackground(w,h,ratio){texCanvas.width=Math.max(1,Math.round(w*ratio));texCanvas.height=Math.max(1,Math.round(h*ratio));const c=texCtx;c.setTransform(ratio,0,0,ratio,0,0);c.fillStyle='#fafafa';c.fillRect(0,0,w,h);c.globalCompositeOperation='multiply';let g=c.createRadialGradient(w*.5,h*.08,0,w*.5,h*.08,w*.6);g.addColorStop(0,'rgba(222,228,242,.55)');g.addColorStop(1,'rgba(250,250,250,1)');c.fillStyle=g;c.fillRect(0,0,w,h);g=c.createRadialGradient(w*.5,h*.95,0,w*.5,h*.95,w*.5);g.addColorStop(0,'rgba(243,234,225,.4)');g.addColorStop(1,'rgba(250,250,250,1)');c.fillStyle=g;c.fillRect(0,0,w,h);c.globalCompositeOperation='source-over';if(logo){const fit=Math.min(w/logo.width,h/logo.height);const dw=logo.width*fit*logoScale,dh=logo.height*fit*logoScale;c.save();c.shadowColor='rgba(55,60,75,.10)';c.shadowBlur=22;c.shadowOffsetY=7;c.drawImage(logo,(w-dw)/2,(h-dh)/2,dw,dh);c.restore();}}
function uploadTexture(){gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);gl.bindTexture(gl.TEXTURE_2D,texture);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,texCanvas);gl.generateMipmap(gl.TEXTURE_2D);}
function resize(){const oldW=canvas.width,oldH=canvas.height,r=canvas.getBoundingClientRect();dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.max(1,Math.round(r.width*dpr));canvas.height=Math.max(1,Math.round(r.height*dpr));gl.viewport(0,0,canvas.width,canvas.height);paintBackground(r.width,r.height,dpr);uploadTexture();if(oldW&&oldH){px*=canvas.width/oldW;py*=canvas.height/oldH;}else{px=canvas.width*.5;py=canvas.height*.52;}if(lenses[0]&&lenses[0].x===0&&lenses[0].y===0){lenses[0].x=px;lenses[0].y=py;}}
function pointerXY(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)*(canvas.width/r.width),(r.bottom-e.clientY)*(canvas.height/r.height)];}
function move(e){if(!activePointers.has(e.pointerId))return;const p=pointerXY(e),start=pointerStarts.get(e.pointerId);activePointers.set(e.pointerId,p);if(activePointers.size===1&&start){if(Math.hypot(p[0]-start.x,p[1]-start.y)>8*dpr)start.moved=true;if(start.moved){autoMotion=false;px=p[0]+dragOffsetX;py=p[1]+dragOffsetY;if(lenses[activeLens]){lenses[activeLens].x=px;lenses[activeLens].y=py;}}}if(activePointers.size>=2){const pts=[...activePointers.values()];const dist=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);if(!pinchStart){pinchStart=dist;pinchScale=lensScale;}else{const maxScale=Math.max(.55,Math.min(canvas.width,canvas.height)/(145*dpr));lensScale=Math.max(.55,Math.min(maxScale,pinchScale*dist/Math.max(1,pinchStart)));if(lenses[activeLens])lenses[activeLens].scale=lensScale;}}}
function wheelZoom(e){e.preventDefault();const maxScale=Math.max(.55,Math.min(canvas.width,canvas.height)/(145*dpr));const factor=Math.exp(-e.deltaY*0.0015);lensScale=Math.max(.55,Math.min(maxScale,lensScale*factor));if(lenses[activeLens])lenses[activeLens].scale=lensScale;}
function down(e){try{canvas.setPointerCapture(e.pointerId);}catch(_){}const p=pointerXY(e);activePointers.set(e.pointerId,p);pointerStarts.set(e.pointerId,{x:p[0],y:p[1],moved:false});if(activePointers.size===1){let nearest=0,best=Infinity;lenses.forEach((l,i)=>{const d=Math.hypot(p[0]-l.x,p[1]-l.y);if(d<best){best=d;nearest=i;}});selectLens(nearest);lenses[activeLens].auto=false;dragOffsetX=px-p[0];dragOffsetY=py-p[1];const t=performance.now()/1000;pressT0=t;ripples.push({x:px,y:py,t,amp:1});if(ripples.length>8)ripples.shift();}if(activePointers.size===2){const pts=[...activePointers.values()];pinchStart=Math.hypot(pts[0][0]-pts[1][0],pts[0][1]-pts[1][1]);pinchScale=lensScale;}}function up(e){const start=pointerStarts.get(e.pointerId);if(start&&!start.moved&&e.type==='pointerup'){const stamp=performance.now();if(stamp-lastTapAt<850)tapCount++;else tapCount=1;lastTapAt=stamp;if(tapCount>=2){autoMotion=true;if(lenses[activeLens])lenses[activeLens].auto=true;tapCount=0;showToast('Movimento automático ativado');}}else if(start&&start.moved){tapCount=0;}activePointers.delete(e.pointerId);pointerStarts.delete(e.pointerId);if(activePointers.size<2)pinchStart=0;}
function frame(){
 now=performance.now()/1000;const time=now-t0;
 if(now-lastAutoRipple>4.5){lastAutoRipple=now;ripples.push({x:lenses[0]?.x||canvas.width*.5,y:lenses[0]?.y||canvas.height*.5,t:now,amp:.5});if(ripples.length>8)ripples.shift();}
 for(let i=ripples.length-1;i>=0;i--)if(now-ripples[i].t>3)ripples.splice(i,1);
 rippleData.fill(0);ripples.forEach((p,i)=>{rippleData[i*4]=p.x;rippleData[i*4+1]=p.y;rippleData[i*4+2]=now-p.t;rippleData[i*4+3]=p.amp;});
 const lensData=new Float32Array(MAX_LENSES*4),shapeData=new Int32Array(MAX_LENSES);
 lenses.forEach((lens,i)=>{if(lens.auto){const radius=120*dpr*lens.scale;const sx=Math.max(0,Math.min(canvas.width*.34,canvas.width*.5-radius-16*dpr));const sy=Math.max(0,Math.min(canvas.height*.28,canvas.height*.5-radius-16*dpr));lens.x=canvas.width*.5+Math.sin(time*.42+lens.phase)*sx;lens.y=canvas.height*.52+Math.sin(time*.31+1.2+lens.phase)*sy;}
 lensData.set([lens.x,lens.y,120*dpr*lens.scale,1],i*4);shapeData[i]=lens.shape;});
 gl.uniform2f(gl.getUniformLocation(program,'uRes'),canvas.width,canvas.height);gl.uniform1f(gl.getUniformLocation(program,'uTime'),time);gl.uniform1f(gl.getUniformLocation(program,'uDpr'),dpr);
 gl.uniform1i(gl.getUniformLocation(program,'uLensCount'),lenses.length);gl.uniform4fv(gl.getUniformLocation(program,'uLensData[0]'),lensData);gl.uniform1iv(gl.getUniformLocation(program,'uShapeData[0]'),shapeData);
 gl.uniform1i(gl.getUniformLocation(program,'uRippleCount'),ripples.length);gl.uniform4fv(gl.getUniformLocation(program,'uRipples[0]'),rippleData);
 gl.drawArrays(gl.TRIANGLES,0,3);raf=requestAnimationFrame(frame);
}
function setShape(s){shape=s;if(lenses[activeLens])lenses[activeLens].shape=s;circleBtn.setAttribute('aria-pressed',String(s===0));squareBtn.setAttribute('aria-pressed',String(s===1));}
function selectLens(i){activeLens=Math.max(0,Math.min(i,lenses.length-1));const l=lenses[activeLens];if(!l)return;px=l.x;py=l.y;lensScale=l.scale;setShape(l.shape);}
function addLens(){if(lenses.length>=MAX_LENSES){showToast('Limite de 12 elementos atingido');return;}const i=lenses.length,cols=3,spacing=Math.min(canvas.width,canvas.height)*.19;const col=i%cols,row=Math.floor(i/cols);lenses.push({x:canvas.width*.5+(col-1)*spacing,y:canvas.height*.5+(row-0.5)*spacing,shape,scale:1,auto:false,phase:0});selectLens(lenses.length-1);showToast('Item adicionado');}
function removeLens(){if(lenses.length===1){showToast('Mantenha pelo menos um elemento na tela');return;}lenses.splice(activeLens,1);selectLens(Math.min(activeLens,lenses.length-1));showToast('Item removido');}
function chooseFile(file){if(!file)return;if(!/^image\/(png|jpeg|webp|svg\+xml)$/.test(file.type)){showToast('Escolha uma imagem PNG, JPG, WebP ou SVG');return;}if(logoUrl)URL.revokeObjectURL(logoUrl);logoUrl=URL.createObjectURL(file);const img=new Image();img.onload=()=>{logo=img;const r=canvas.getBoundingClientRect();paintBackground(r.width,r.height,dpr);uploadTexture();showToast('Logo adicionada');};img.onerror=()=>showToast('Não foi possível abrir essa imagem');img.src=logoUrl;}
function savePNG(){
  const lens=lenses[activeLens];
  if(!lens){showToast('Selecione uma lente para exportar');return;}
  if(!gl||!program){showToast('O efeito ainda não está pronto');return;}

  // Renderiza somente a lente selecionada. Assim, outras lentes não entram
  // acidentalmente no arquivo exportado.
  const lensData=new Float32Array(MAX_LENSES*4);
  const shapeData=new Int32Array(MAX_LENSES);
  lensData.set([lens.x,lens.y,120*dpr*lens.scale,1],0);
  shapeData[0]=lens.shape;
  gl.useProgram(program);
  gl.uniform1i(gl.getUniformLocation(program,'uLensCount'),1);
  gl.uniform4fv(gl.getUniformLocation(program,'uLensData[0]'),lensData);
  gl.uniform1iv(gl.getUniformLocation(program,'uShapeData[0]'),shapeData);
  gl.drawArrays(gl.TRIANGLES,0,3);
  gl.finish();

  const w=canvas.width,h=canvas.height;
  const pixels=new Uint8Array(w*h*4);
  gl.readPixels(0,0,w,h,gl.RGBA,gl.UNSIGNED_BYTE,pixels);

  const frameCanvas=document.createElement('canvas');
  frameCanvas.width=w;frameCanvas.height=h;
  const frameCtx=frameCanvas.getContext('2d',{willReadFrequently:true});
  const imageData=frameCtx.createImageData(w,h);
  const rowBytes=w*4;
  for(let y=0;y<h;y++){
    const sourceRow=(h-1-y)*rowBytes;
    imageData.data.set(pixels.subarray(sourceRow,sourceRow+rowBytes),y*rowBytes);
  }
  frameCtx.putImageData(imageData,0,0);

  // Margem transparente evita cortar a borda orgânica da refração.
  const diameter=240*dpr*lens.scale;
  const cropSide=Math.max(2,Math.ceil(diameter*1.16));
  const out=document.createElement('canvas');
  const outSize=Math.max(2,Math.round(cropSide*2));
  out.width=outSize;out.height=outSize;
  const ctx=out.getContext('2d');
  const centerX=lens.x,centerY=h-lens.y;
  const scale=outSize/cropSide;
  ctx.drawImage(
    frameCanvas,
    (cropSide/2-centerX)*scale,
    (cropSide/2-centerY)*scale,
    w*scale,
    h*scale
  );

  // A máscara alpha recorta a própria lente. O restante do PNG fica
  // realmente transparente (alpha 0), sem fundo branco ou quadriculado.
  const lensSide=outSize/1.16;
  ctx.globalCompositeOperation='destination-in';
  ctx.beginPath();
  if(lens.shape===0){
    ctx.arc(outSize/2,outSize/2,lensSide/2,0,Math.PI*2);
  }else{
    const radius=lensSide*.12;
    ctx.roundRect((outSize-lensSide)/2,(outSize-lensSide)/2,lensSide,lensSide,radius);
  }
  ctx.fill();
  ctx.globalCompositeOperation='source-over';

  out.toBlob(blob=>{
    if(!blob){showToast('Falha ao preparar o PNG');return;}
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;
    a.download=lens.shape===0?'liquid-glass-circle.png':'liquid-glass-square.png';
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    showToast('PNG transparente exportado');
  },'image/png');
}
